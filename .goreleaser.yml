# GoReleaser configuration for Tally.
# Docs: https://goreleaser.com
version: 2

project_name: tally

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: tally
    main: .
    binary: tally
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.buildVersion={{.Version}}

archives:
  - id: tally
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# GoReleaser v2 distributes CLI binaries as Homebrew casks. Tag releases
# require HOMEBREW_TAP_GITHUB_TOKEN with write access to this tap repository.
homebrew_casks:
  - name: tally
    repository:
      owner: blakep-lms
      name: homebrew-tap
    homepage: "https://github.com/blakep-lms/tally"
    description: "Automatic, local-first time tracking across projects, products, goals, and other work."
    license: "MIT"
