name: Derived Code Map

on:
  push:
    branches: [main]
    paths:
      - "**/*.c"
      - "**/*.cpp"
      - "**/*.css"
      - "**/*.go"
      - "**/*.h"
      - "**/*.html"
      - "**/*.java"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.json"
      - "**/*.kt"
      - "**/*.mjs"
      - "**/*.php"
      - "**/*.prisma"
      - "**/*.py"
      - "**/*.rb"
      - "**/*.rs"
      - "**/*.scss"
      - "**/*.sh"
      - "**/*.sql"
      - "**/*.svelte"
      - "**/*.swift"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.vue"
      - "Dockerfile*"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "pnpm-lock.yaml"
      - "package-lock.json"
      - "pyproject.toml"
      - "requirements*.txt"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".openwikiignore"
      - "openwiki/INSTRUCTIONS.md"
      - ".github/scripts/package-code-map.py"
      - ".github/workflows/code-map.yml"
  pull_request:
    branches: [main]
    paths:
      - ".openwikiignore"
      - "openwiki/INSTRUCTIONS.md"
      - ".github/scripts/package-code-map.py"
      - ".github/workflows/code-map.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-map-${{ github.ref }}
  cancel-in-progress: true

env:
  CODE_MAP_PROJECT: "tally"
  CODE_MAP_TITLE: "Tally"
  CODE_MAP_VAULT_OWNER: "silas/products/tally"
  OPENWIKI_PROVIDER: gemini
  OPENWIKI_MODEL_ID: gemini-3.5-flash-lite
  OPENWIKI_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  LANGCHAIN_TRACING_V2: "false"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify provider credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY"

      - name: Install pinned OpenWiki
        run: |
          mkdir -p "$RUNNER_TEMP/openwiki-runtime"
          npm install --prefix "$RUNNER_TEMP/openwiki-runtime" \
            --package-lock=false openwiki@0.3.1

      - name: Generate source-grounded wiki
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          "$RUNNER_TEMP/openwiki-runtime/node_modules/.bin/openwiki" \
            code --init --print --modelId "$OPENWIKI_MODEL_ID" \
            "Generate the source-grounded ${CODE_MAP_TITLE} code map described in openwiki/INSTRUCTIONS.md."

      - name: Package and validate derived output
        run: |
          python3 .github/scripts/package-code-map.py \
            --source openwiki \
            --output "$RUNNER_TEMP/code-map" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --ref "$GITHUB_REF_NAME" \
            --model "$OPENWIKI_MODEL_ID" \
            --project "$CODE_MAP_PROJECT" \
            --canonical-vault-owner "$CODE_MAP_VAULT_OWNER" \
            --title "$CODE_MAP_TITLE"

      - name: Upload review artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.CODE_MAP_PROJECT }}-code-map-${{ github.sha }}
          path: ${{ runner.temp }}/code-map
          if-no-files-found: error
          retention-days: 14

      - name: Publish current map to code-map branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PUBLISH_DIR: ${{ runner.temp }}/code-map
        run: |
          git reset --hard HEAD
          git clean -fdx
          git switch --orphan code-map-publish
          git rm -rf . || true
          cp -R "$PUBLISH_DIR"/. .
          git add README.md provenance.json wiki
          git -c user.name="lms-code-map-bot" \
              -c user.email="code-map-bot@users.noreply.github.com" \
              commit -m "docs: generate code map for ${GITHUB_SHA::12}"
          git push --force origin HEAD:code-map
